<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile visual review</title><style>body{margin:0;background:#f5f6f7;font:14px Arial;color:#174a68}nav{padding:8px;text-align:center}nav a{margin:4px;display:inline-block;color:inherit}iframe{display:block;width:390px;height:650px;max-width:100%;margin:0 auto;border:1px solid #dde1e5;background:#fff}</style></head><body><nav id="languages"></nav><nav id="sections"></nav><iframe title="Mobile preview"></iframe><script>const q=new URLSearchParams(location.search),v=q.get('v')||'final-complete',l=['english','japanese','french','arabic'].includes(q.get('language'))?q.get('language'):'english',s=['about','expertise','design','branding','pr','career','contact'].includes(q.get('section'))?q.get('section'):'about';document.querySelector('#languages').innerHTML=['english','japanese','french','arabic'].map(x=>`<a href="?language=${x}&section=${s}&v=${encodeURIComponent(v)}">${x==='pr'?'PR':x.charAt(0).toUpperCase()+x.slice(1)}</a>`).join('');document.querySelector('#sections').innerHTML=['about','expertise','design','branding','pr','career','contact'].map(x=>`<a href="?language=${l}&section=${x}&v=${encodeURIComponent(v)}">${x==='pr'?'PR':x.charAt(0).toUpperCase()+x.slice(1)}</a>`).join('');const preview=document.querySelector('iframe');preview.addEventListener('load',()=>{requestAnimationFrame(()=>{const target=preview.contentDocument?.getElementById(s);target?.scrollIntoView({block:'start'});});});preview.src=`website-${l}-review.html?v=${encodeURIComponent(v)}#${s}`;</script></body></html>
